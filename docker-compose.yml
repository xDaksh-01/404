  voltage-regulator:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python services/voltage-regulator/app.py
    environment: *service_hosts
    ports:
      - "5009:5009"
    volumes:
      - ./testing/logs:/app/testing/logs
      - ./ml/models:/app/ml/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5009/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  fault-detection:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python services/fault-detection/app.py
    environment: *service_hosts
    ports:
      - "5010:5010"
    volumes:
      - ./testing/logs:/app/testing/logs
      - ./ml/models:/app/ml/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5010/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  ml-trainer:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python ml/train_model.py
    environment: *service_hosts
    volumes:
      - ./ml/models:/app/ml/models
      - ./testing/logs:/app/testing/logs
    restart: "no"

  ml-anomaly-detector:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python ml/run_anomaly_detector.py
    environment: *service_hosts
    depends_on:
      ml-trainer:
        condition: service_completed_successfully
      grid-controller:
        condition: service_healthy
      transformer:
        condition: service_healthy
      zone-north:
        condition: service_healthy
      zone-south:
        condition: service_healthy
      zone-east:
        condition: service_healthy
      zone-west:
        condition: service_healthy
      zone-central:
        condition: service_healthy
      load-balancer:
        condition: service_healthy
      voltage-regulator:
        condition: service_healthy
      fault-detection:
        condition: service_healthy
    volumes:
      - ./ml/models:/app/ml/models
      - ./testing/logs:/app/testing/logs

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      grid-controller:
        condition: service_healthy
      transformer:
        condition: service_healthy
      zone-north:
        condition: service_healthy
      zone-south:
        condition: service_healthy
      zone-east:
        condition: service_healthy
      zone-west:
        condition: service_healthy
      zone-central:
        condition: service_healthy
      load-balancer:
        condition: service_healthy
      voltage-regulator:
        condition: service_healthy
      fault-detection:
        condition: service_healthy
    ports:
      - "3000:80"

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on:
      grid-controller:
        condition: service_healthy
      transformer:
        condition: service_healthy
      zone-north:
        condition: service_healthy
      zone-south:
        condition: service_healthy
      zone-east:
        condition: service_healthy
      zone-west:
        condition: service_healthy
      zone-central:
        condition: service_healthy
      load-balancer:
        condition: service_healthy
      voltage-regulator:
        condition: service_healthy
      fault-detection:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=http://localhost:3000/prometheus
      - --web.route-prefix=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.2
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards-json:ro
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data:
