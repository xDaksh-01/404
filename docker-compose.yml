services:
  grid-controller:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python services/grid-controller/app.py
    environment: &service_hosts
      GRID_CONTROLLER_HOST: grid-controller
      TRANSFORMER_HOST: transformer
      ZONE_NORTH_HOST: zone-north
      ZONE_SOUTH_HOST: zone-south
      ZONE_EAST_HOST: zone-east
      ZONE_WEST_HOST: zone-west
      ZONE_CENTRAL_HOST: zone-central
      LOAD_BALANCER_HOST: load-balancer
      VOLTAGE_REGULATOR_HOST: voltage-regulator
      FAULT_DETECTION_HOST: fault-detection
    ports:
      - "5001:5001"
    volumes:
      - ./testing/logs:/app/testing/logs
      - ./ml/models:/app/ml/models
    healthcheck: &python_health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  transformer:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python services/transformer/app.py
    environment: *service_hosts
    ports:
      - "5002:5002"
    volumes:
      - ./testing/logs:/app/testing/logs
      - ./ml/models:/app/ml/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  zone-north:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python services/zone-north/app.py
    environment: *service_hosts
    ports:
      - "5003:5003"
    volumes:
      - ./testing/logs:/app/testing/logs
      - ./ml/models:/app/ml/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5003/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  zone-south:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python services/zone-south/app.py
    environment: *service_hosts
    ports:
      - "5004:5004"
    volumes:
      - ./testing/logs:/app/testing/logs
      - ./ml/models:/app/ml/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5004/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  zone-east:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python services/zone-east/app.py
    environment: *service_hosts
    ports:
      - "5005:5005"
    volumes:
      - ./testing/logs:/app/testing/logs
      - ./ml/models:/app/ml/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5005/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  zone-west:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python services/zone-west/app.py
    environment: *service_hosts
    ports:
      - "5006:5006"
    volumes:
      - ./testing/logs:/app/testing/logs
      - ./ml/models:/app/ml/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5006/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

  zone-central:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python services/zone-central/app.py
    environment: *service_hosts
    ports:
