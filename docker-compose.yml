    volumes:
      - ./testing/logs:/app/testing/logs
      - ./ml/models:/app/ml/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5007/health', timeout=2)"]
