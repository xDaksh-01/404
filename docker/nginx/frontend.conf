server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /grafana {
    return 301 /grafana/;
  }

  location = /prometheus {
    return 301 /prometheus/;
  }

  location /grafana/ {
    proxy_pass http://grafana:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /prometheus/ {
    proxy_pass http://prometheus:9090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }

  location /api/gc/ {
    proxy_pass http://grid-controller:5001/;
  }

  location /api/tr/ {
    proxy_pass http://transformer:5002/;
  }

  location /api/zn/ {
    proxy_pass http://zone-north:5003/;
  }

  location /api/zs/ {
    proxy_pass http://zone-south:5004/;
  }

  location /api/ze/ {
    proxy_pass http://zone-east:5005/;
  }

  location /api/zw/ {
    proxy_pass http://zone-west:5006/;
  }

  location /api/zc/ {
    proxy_pass http://zone-central:5007/;
  }

  location /api/lb/ {
    proxy_pass http://load-balancer:5008/;
  }

  location /api/vr/ {
    proxy_pass http://voltage-regulator:5009/;
  }

  location /api/fd/ {
    proxy_pass http://fault-detection:5010/;
  }
}
